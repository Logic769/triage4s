# LLM4S provider sections `--provider` can name (#99). Each provider module reads its vendor's usual key variable
# (OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY); Ollama needs none. Add your own with -Dconfig.file=...
llm4s.providers {
  openai {
    provider = "openai"
    model    = "gpt-4o-mini"
  }
  anthropic {
    provider = "anthropic"
    model    = "claude-sonnet-4-5"
  }
  gemini {
    provider = "gemini"
    model    = "gemini-2.5-flash"
  }
  ollama {
    provider = "ollama"
    model    = "qwen2.5:7b"
    baseUrl  = "http://localhost:11434"
    baseUrl  = ${?OLLAMA_BASE_URL}
  }
}
