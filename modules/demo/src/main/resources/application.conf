# LLM4S provider sections the demo can use (#88). Choose one with TRIAGE_PROVIDER=<section name>; without it, the demo
# calls OpenAI with OPENAI_API_KEY and TRIAGE_MODEL as before. TRIAGE_MODEL, when set, replaces a section's model.
#
# Each provider module reads its vendor's usual key variable (OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY);
# Ollama needs none. Add your own sections - another account, Azure, an OpenAI-compatible server - in a file passed
# with -Dconfig.file=..., which can include this one: https://github.com/llm4s/llm4s/blob/main/docs/guide/providers.md
llm4s.providers {
  openai {
    provider = "openai"
    model    = "gpt-4o-mini"
  }
  anthropic {
    provider = "anthropic"
    model    = "claude-sonnet-4-5"
  }
  gemini {
    provider = "gemini"
    model    = "gemini-2.5-flash"
  }
  ollama {
    provider = "ollama"
    model    = "qwen2.5:7b"
    baseUrl  = "http://localhost:11434"
    baseUrl  = ${?OLLAMA_BASE_URL}
  }
}
