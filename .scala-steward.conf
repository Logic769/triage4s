# Scala Steward settings (#93): https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# LLM4S is released as several modules with one version; move them together, in one pull request.
pullRequests.grouping = [
  { name = "llm4s", title = "Update LLM4S", "filter" = [{"group" = "org.llm4s"}] }
]

# At most one pull request per dependency per week.
pullRequests.frequency = "7 days"

commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"
